name: Build Ly Dragon GLB

on:
  push:
    branches: [main]
    paths:
      - "tools/ly-dragon/**"
      - ".github/workflows/build-ly-dragon.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-model:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: tools/ly-dragon/requirements.txt

      - name: Install generator dependencies
        run: pip install -r tools/ly-dragon/requirements.txt

      - name: Generate GLB
        run: |
          mkdir -p public/embedded/ly-dragon/models
          python tools/ly-dragon/generator/build.py \
            --spec tools/ly-dragon/spec/ly-dragon.spec.v2.json \
            --out public/embedded/ly-dragon/models/rong-thoi-ly-v2.glb

      - name: Commit generated model
        run: |
          if [ -z "$(git status --porcelain -- public/embedded/ly-dragon/models/rong-thoi-ly-v2.glb)" ]; then
            echo "Model is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/embedded/ly-dragon/models/rong-thoi-ly-v2.glb
          git commit -m "Build Ly dragon GLB from spec"
          git push
