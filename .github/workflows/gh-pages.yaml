# Build and deploy the statically exported Next.js site to GitHub Pages.
name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Validate Buddha HTML bootstrap
        run: node scripts/check-buddha-html.cjs public/embedded/buddha/index.html

      - name: Install dependencies
        run: npm install

      - name: Install self-hosted Three.js runtime
        run: npm install --no-save --package-lock=false three@0.169.0

      - name: Build with Next.js
        run: npm run build

      - name: Add clean-url indexes for mini apps
        shell: bash
        run: |
          set -euo pipefail
          MINI_APPS=(knowledge dau-thau yi-jing office buddha ly-dragon)

          for app in "${MINI_APPS[@]}"; do
            source="out/apps/${app}.html"
            target="out/apps/${app}/index.html"

            test -f "${source}"
            mkdir -p "out/apps/${app}"
            cp "${source}" "${target}"

            test -s "${target}"
            cmp -s "${source}" "${target}"
            echo "Mini app route ready: /apps/${app} and /apps/${app}/"
          done

      - name: Add self-hosted Gautama Buddha model
        shell: bash
        run: |
          set -euo pipefail
          MODEL_DIR="out/embedded/buddha"
          MODEL_FILE="${MODEL_DIR}/buddha.glb"
          MODEL_URL="https://zenodo.org/api/records/21411042/files/40d93bdf1adff502187afac506be4b15_normalized-0.500.glb/content"

          mkdir -p "${MODEL_DIR}"
          curl -fL --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 120             "${MODEL_URL}"             -o "${MODEL_FILE}"

          echo "f938a7e1973767b1004931ec86a5e8e5  ${MODEL_FILE}" | md5sum -c -
          test "$(head -c 4 "${MODEL_FILE}")" = "glTF"
          echo "Buddha GLB ready: $(du -h "${MODEL_FILE}" | cut -f1)"

      - name: Add self-hosted Three.js runtime for Buddha
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME_DIR="out/embedded/buddha/vendor"
          THREE_SOURCE="node_modules/three"

          mkdir -p "${RUNTIME_DIR}/loaders" "${RUNTIME_DIR}/controls" "${RUNTIME_DIR}/libs/draco" "${RUNTIME_DIR}/utils"

          cp "${THREE_SOURCE}/build/three.module.js" "${RUNTIME_DIR}/three.module.js"
          cp "${THREE_SOURCE}/examples/jsm/loaders/GLTFLoader.js" "${RUNTIME_DIR}/loaders/GLTFLoader.js"
          cp "${THREE_SOURCE}/examples/jsm/controls/OrbitControls.js" "${RUNTIME_DIR}/controls/OrbitControls.js"
          cp "${THREE_SOURCE}/examples/jsm/loaders/DRACOLoader.js" "${RUNTIME_DIR}/loaders/DRACOLoader.js"
          cp "${THREE_SOURCE}/examples/jsm/utils/BufferGeometryUtils.js" "${RUNTIME_DIR}/utils/BufferGeometryUtils.js"
          cp "${THREE_SOURCE}/examples/jsm/libs/meshopt_decoder.module.js" "${RUNTIME_DIR}/libs/meshopt_decoder.module.js"
          cp "${THREE_SOURCE}/examples/jsm/libs/draco/draco_decoder.js" "${RUNTIME_DIR}/libs/draco/draco_decoder.js"
          cp "${THREE_SOURCE}/examples/jsm/libs/draco/draco_decoder.wasm" "${RUNTIME_DIR}/libs/draco/draco_decoder.wasm"
          cp "${THREE_SOURCE}/examples/jsm/libs/draco/draco_wasm_wrapper.js" "${RUNTIME_DIR}/libs/draco/draco_wasm_wrapper.js"

          test -s "${RUNTIME_DIR}/three.module.js"
          test -s "${RUNTIME_DIR}/loaders/GLTFLoader.js"
          test -s "${RUNTIME_DIR}/controls/OrbitControls.js"
          test -s "${RUNTIME_DIR}/loaders/DRACOLoader.js"
          test -s "${RUNTIME_DIR}/utils/BufferGeometryUtils.js"
          test -s "${RUNTIME_DIR}/libs/meshopt_decoder.module.js"
          test -s "${RUNTIME_DIR}/libs/draco/draco_decoder.wasm"

          node scripts/check-buddha-runtime.cjs "${RUNTIME_DIR}"
          echo "Buddha runtime and all imported modules verified"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4