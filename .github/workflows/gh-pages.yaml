# Build and deploy the statically exported Next.js site to GitHub Pages.
name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install

      - name: Install self-hosted Three.js runtime
        run: npm install --no-save --package-lock=false three@0.169.0

      - name: Build with Next.js
        run: npm run build

      - name: Add clean-url indexes for mini apps
        shell: bash
        run: |
          set -euo pipefail
          MINI_APPS=(knowledge dau-thau yi-jing office buddha ly-dragon)

          for app in "${MINI_APPS[@]}"; do
            source="out/apps/${app}.html"
            target="out/apps/${app}/index.html"

            test -f "${source}"
            mkdir -p "out/apps/${app}"
            cp "${source}" "${target}"

            test -s "${target}"
            cmp -s "${source}" "${target}"
            echo "Mini app route ready: /apps/${app} and /apps/${app}/"
          done

      - name: Add self-hosted Gautama Buddha model
        shell: bash
        run: |
          set -euo pipefail
          MODEL_DIR="out/embedded/buddha"
          MODEL_FILE="${MODEL_DIR}/buddha.glb"
          MODEL_URL="https://zenodo.org/api/records/21411042/files/40d93bdf1adff502187afac506be4b15_normalized-0.500.glb/content"

          mkdir -p "${MODEL_DIR}"
          curl -fL --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 120             "${MODEL_URL}"             -o "${MODEL_FILE}"

          echo "f938a7e1973767b1004931ec86a5e8e5  ${MODEL_FILE}" | md5sum -c -
          test "$(head -c 4 "${MODEL_FILE}")" = "glTF"
          echo "Buddha GLB ready: $(du -h "${MODEL_FILE}" | cut -f1)"

      - name: Add self-hosted Three.js runtime for Buddha
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME_DIR="out/embedded/buddha/vendor"
          DRACO_DIR="${RUNTIME_DIR}/draco"

          mkdir -p "${DRACO_DIR}"

          cp node_modules/three/build/three.module.js "${RUNTIME_DIR}/three.module.js"
          cp node_modules/three/examples/jsm/loaders/GLTFLoader.js "${RUNTIME_DIR}/GLTFLoader.js"
          cp node_modules/three/examples/jsm/controls/OrbitControls.js "${RUNTIME_DIR}/OrbitControls.js"
          cp node_modules/three/examples/jsm/loaders/DRACOLoader.js "${RUNTIME_DIR}/DRACOLoader.js"
          cp node_modules/three/examples/jsm/libs/meshopt_decoder.module.js "${RUNTIME_DIR}/meshopt_decoder.module.js"
          cp node_modules/three/examples/jsm/libs/draco/draco_decoder.js "${DRACO_DIR}/draco_decoder.js"
          cp node_modules/three/examples/jsm/libs/draco/draco_decoder.wasm "${DRACO_DIR}/draco_decoder.wasm"
          cp node_modules/three/examples/jsm/libs/draco/draco_wasm_wrapper.js "${DRACO_DIR}/draco_wasm_wrapper.js"

          test -s "${RUNTIME_DIR}/three.module.js"
          test -s "${RUNTIME_DIR}/GLTFLoader.js"
          test -s "${RUNTIME_DIR}/OrbitControls.js"
          test -s "${RUNTIME_DIR}/DRACOLoader.js"
          test -s "${RUNTIME_DIR}/meshopt_decoder.module.js"
          test -s "${DRACO_DIR}/draco_decoder.wasm"

          echo "Buddha runtime self-hosted under /embedded/buddha/vendor/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4