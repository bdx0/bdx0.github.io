# Build and deploy the statically exported Next.js site to GitHub Pages.
name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install

      - name: Build with Next.js
        run: npm run build

      - name: Add self-hosted Gautama Buddha model
        shell: bash
        run: |
          set -euo pipefail
          MODEL_DIR="out/apps/buddha"
          MODEL_FILE="${MODEL_DIR}/buddha.glb"
          MODEL_URL="https://zenodo.org/api/records/21411042/files/40d93bdf1adff502187afac506be4b15_normalized-0.500.glb/content"

          mkdir -p "${MODEL_DIR}"
          curl -fL --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 120             "${MODEL_URL}"             -o "${MODEL_FILE}"

          echo "f938a7e1973767b1004931ec86a5e8e5  ${MODEL_FILE}" | md5sum -c -
          test "$(head -c 4 "${MODEL_FILE}")" = "glTF"
          echo "Buddha GLB ready: $(du -h "${MODEL_FILE}" | cut -f1)"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
