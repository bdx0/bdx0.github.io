# Sample workflow for building and deploying a Next.js site to GitHub Pages.
#
# To get started with Next.js see: https://nextjs.org/docs/getting-started
#
name: Deploy Next.js site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Probe 3dstl Buddha download endpoint
        shell: bash
        run: |
          set +e
          PAGE="https://www.3dstl.io/printable-detail/The-Sitting-Buddha-Marcus-Aurelius-zYZRdO"
          PREFIX='XstD+hYQQ8GlF3U4/1B1opLiyigCV+VFPpqh4F+UNehT54R3X0EaoRNB9YLesI6HDAdyzdQizkIC gfWoeuS7RQVJutpZ3w90VmmRm5Fl+cXEMKAr5iGaCkBOGSoQBGq5fowBVOXz5I83l1Vu2ARdaZ5Q VNkdZOmF'
          BODY="${PREFIX}zYZRdO"

          echo "=== Request prepared download URL from 3dstl ==="
          curl -sS -L --retry 2 --connect-timeout 20 --max-time 90             -A "Mozilla/5.0"             -H "Accept: application/json, text/plain, */*"             -H "Content-Type: application/json"             -H "Origin: https://www.3dstl.io"             -H "Referer: ${PAGE}"             --data-binary "${BODY}"             "https://www.3dstl.io/project/file"             -o /tmp/3dstl-response.json

          echo "response-size=$(wc -c < /tmp/3dstl-response.json 2>/dev/null || echo 0)"
          echo -n "response-prefix="
          head -c 500 /tmp/3dstl-response.json 2>/dev/null || true
          echo

          URL="$(python3 - <<'PY'
import json
from pathlib import Path
p=Path('/tmp/3dstl-response.json')
try:
    outer=json.loads(p.read_text())
    inner=outer.get('data')
    if isinstance(inner,str):
        try:
            inner=json.loads(inner)
        except Exception:
            pass
    if isinstance(inner,dict):
        url=inner.get('data') or inner.get('url') or ''
    elif isinstance(inner,str):
        url=inner
    else:
        url=''
    print(url)
except Exception:
    print('')
PY
          )"

          if [ -n "${URL}" ]; then
            echo "prepared-url=yes"
            curl -sS -L --retry 2 --connect-timeout 20 --max-time 120               -A "Mozilla/5.0"               "${URL}"               -o /tmp/3dstl-prepared-model.bin
            echo "model-size=$(wc -c < /tmp/3dstl-prepared-model.bin 2>/dev/null || echo 0)"
            file /tmp/3dstl-prepared-model.bin || true
            echo -n "model-first84="
            head -c 84 /tmp/3dstl-prepared-model.bin 2>/dev/null | xxd -p || true
            echo
          else
            echo "prepared-url=no"
          fi

      - name: Install dependencies
        run: npm install
      - name: Build with Next.js
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
