const assessWithAllCombinationGaps=assess;assess=()=>{assessWithAllCombinationGaps();let n=valid(),o=$('#out');if(!n||!o||o.querySelector('.triple-detail'))return;let cutoff=S.evalDraw?(S.evalEnd??((S.evalOriginalCutoff||S.evalDraw.draw_number)-1)):null,R=cutoff===null?analysis().R:rows().filter(x=>x.draw_number<=cutoff);if(!R.length)return;let gap=test=>{let i=R.findIndex(test);return i<0?R.length:i},detail=keys(n,3).map(k=>{let q=k.split('-').map(Number),count=R.reduce((total,draw)=>total+(q.every(v=>draw.numbers.includes(v))?1:0),0),g=gap(draw=>q.every(v=>draw.numbers.includes(v)));return{label:k.replaceAll('-',' · '),count,g}}).sort((a,b)=>b.g-a.g||a.label.localeCompare(b.label)),pairHeading=[...o.querySelectorAll('.combo-detail h3')].find(x=>x.textContent.includes('Bộ 2'));if(pairHeading&&!pairHeading.textContent.includes('/ 15'))pairHeading.textContent+=' · 15 / 15 cặp';let holder=o.querySelector('.combo-detail');if(!holder)return;holder.insertAdjacentHTML('beforeend','<h3>Chi tiết Bộ 3 · 20 / 20 bộ</h3><p>Sắp xếp gap giảm dần. “Chưa từng xuất hiện” nghĩa là chưa có trong toàn bộ mốc dữ liệu đang chọn.</p><div class="combo-detail-grid triple-detail">'+detail.map(x=>'<div class="combo-detail-card"><b>'+x.label+'</b><span>'+x.count+' lần · gap '+x.g+' kỳ'+(x.count?'':' · chưa từng xuất hiện')+'</span></div>').join('')+'</div>')};

ộ 3 đã thấy / mở</th><th>Bộ 3 gap 300+</th><th>Cặp gap 100+</th></tr></thead><tbody>'+rows+'</tbody></table></div><div class="notice"><b>Ngoại lệ:</b> #01521 có 9/15 cặp gap 100+; chỉ khoảng 0,6% trong 8.000 bộ ngẫu nhiên tại cùng mốc đạt ít nhất mức này. Đây mới chỉ là một lần, nên không phải quy tắc. Mọi bộ Mega hợp lệ vẫn có xác suất Jackpot như nhau: 1 / C(45,6) = 1 / 8.145.060.</div></article>'}
