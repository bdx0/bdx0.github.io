<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071012">
<title>Rồng thời Lý 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071012;color:#f5ead6;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#app{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}
.panel{position:fixed;z-index:4;top:18px;left:18px;width:min(370px,calc(100vw - 36px));padding:16px 17px;border:1px solid rgba(255,255,255,.12);border-radius:18px;background:rgba(10,16,17,.62);backdrop-filter:blur(16px);box-shadow:0 18px 50px rgba(0,0,0,.28)}
h1{font-size:clamp(22px,4vw,34px);margin:0 0 7px;letter-spacing:.01em}p{font-size:13px;line-height:1.55;margin:0;color:#beb3a0}
.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}button{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);color:#f5ead6;padding:8px 12px;border-radius:999px;font-weight:650;cursor:pointer}
button:hover{background:rgba(255,255,255,.14)}.tag{position:fixed;right:15px;bottom:15px;z-index:4;padding:9px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:rgba(5,8,9,.60);font-size:11px;letter-spacing:.08em;color:#d7cdb9}
.note{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:4;font-size:11px;color:#afa692;white-space:nowrap;opacity:.8}
@media(max-width:640px){.panel{top:12px;left:12px;width:calc(100vw - 24px);padding:13px 14px}.panel p{font-size:12px}.note{display:none}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"}}</script>
</head>
<body>
<div id="app"></div>
<div class="panel">
  <h1>Rồng thời Lý — 3D</h1>
  <p>Mô hình tương tác lấy cảm hứng từ hình tượng rồng thời Lý: thân dài thanh, đường uốn mềm, đầu nhỏ, râu dài, mào lửa và chân nhỏ. Kéo để xoay, cuộn hoặc chụm để zoom.</p>
  <div class="buttons"><button id="spin">Dừng xoay</button><button id="material">Đổi chất liệu</button><button id="reset">Góc nhìn ban đầu</button></div>
</div>
<div class="tag">THREE.JS • WEBGL</div>
<div class="note">Vietnamese Lý dynasty dragon — interactive study</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x071012);
scene.fog=new THREE.FogExp2(0x071012,.034);

const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);
camera.position.set(11,6.2,13.5);

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.18;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.getElementById('app').appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.dampingFactor=.055;
controls.target.set(0,.65,0);
controls.minDistance=7;
controls.maxDistance=28;
controls.maxPolarAngle=Math.PI*.82;
controls.autoRotate=true;
controls.autoRotateSpeed=.72;

scene.add(new THREE.HemisphereLight(0xd8fff5,0x17201f,1.75));
const key=new THREE.DirectionalLight(0xffe7ba,4.7);key.position.set(7,10,8);key.castShadow=true;key.shadow.mapSize.set(2048,2048);scene.add(key);
const rim=new THREE.DirectionalLight(0x65d5ca,4.4);rim.position.set(-8,4,-7);scene.add(rim);
const warm=new THREE.PointLight(0xff9d66,18,26,2);warm.position.set(5,-1,5);scene.add(warm);

const palettes=[
{body:0x3f766c,body2:0x72aa98,belly:0xd8c992,horn:0xe0d3ad,mane:0x956d3b,eye:0xffd568,claw:0xd4c49b},
{body:0x755c3e,body2:0xab8450,belly:0xdfc27d,horn:0xead8ad,mane:0xb07a31,eye:0xffdc6a,claw:0xddcba2},
{body:0x858780,body2:0xbab8aa,belly:0xd6cfb8,horn:0xe4ddc7,mane:0x8d806c,eye:0xf0c65a,claw:0xd7cfb5}
];
let paletteIndex=0;
const mats={};
function matset(p){
  mats.body=new THREE.MeshPhysicalMaterial({color:p.body,roughness:.38,metalness:.18,clearcoat:.28,clearcoatRoughness:.45});
  mats.body2=new THREE.MeshPhysicalMaterial({color:p.body2,roughness:.34,metalness:.14,clearcoat:.2});
  mats.belly=new THREE.MeshPhysicalMaterial({color:p.belly,roughness:.48,metalness:.06});
  mats.horn=new THREE.MeshStandardMaterial({color:p.horn,roughness:.6});
  mats.mane=new THREE.MeshStandardMaterial({color:p.mane,roughness:.5,metalness:.1});
  mats.eye=new THREE.MeshStandardMaterial({color:p.eye,emissive:p.eye,emissiveIntensity:1.35,roughness:.2});
  mats.black=new THREE.MeshStandardMaterial({color:0x100d08,roughness:.55});
  mats.claw=new THREE.MeshStandardMaterial({color:p.claw,roughness:.5});
}
matset(palettes[0]);

const dragon=new THREE.Group();dragon.rotation.set(-.08,-.10,.02);scene.add(dragon);
const pts=[
new THREE.Vector3(-6.7,-.4,-.25),new THREE.Vector3(-5.7,1.0,.45),new THREE.Vector3(-4.1,2.1,.05),
new THREE.Vector3(-2.2,1.65,-.48),new THREE.Vector3(-.5,.2,-.05),new THREE.Vector3(1,-1.05,.55),
new THREE.Vector3(2.7,-.4,.12),new THREE.Vector3(4,1.25,-.34),new THREE.Vector3(5.4,2,.02)
];
const spine=new THREE.CatmullRomCurve3(pts,false,'centripetal',.55);
const body=new THREE.Mesh(new THREE.TubeGeometry(spine,220,.46,18,false),mats.body);body.castShadow=body.receiveShadow=true;dragon.add(body);

function frame(t){
  const p=spine.getPointAt(t),tangent=spine.getTangentAt(t).normalize(),up=new THREE.Vector3(0,1,0);
  let side=new THREE.Vector3().crossVectors(tangent,up);if(side.lengthSq()<.01)side.set(0,0,1);side.normalize();
  return {p,tangent,side,normal:new THREE.Vector3().crossVectors(side,tangent).normalize()};
}
for(let i=4;i<79;i+=3){
  const t=i/84,f=frame(t),g=new THREE.SphereGeometry(.28,12,8);g.scale(1.15,.42,.80);
  const m=new THREE.Mesh(g,mats.belly);m.position.copy(f.p).addScaledVector(f.normal,-.36);m.quaternion.setFromUnitVectors(new THREE.Vector3(1,0,0),f.tangent);dragon.add(m);
}
for(let i=7;i<75;i+=2){
  const t=i/82,f=frame(t);
  for(const s of [-1,1]){if((i+s)%3===0)continue;const g=new THREE.SphereGeometry(.16,9,7);g.scale(1.25,.28,.72);const m=new THREE.Mesh(g,mats.body2);m.position.copy(f.p).addScaledVector(f.side,s*.40).addScaledVector(f.normal,.03);m.quaternion.setFromUnitVectors(new THREE.Vector3(1,0,0),f.tangent);dragon.add(m)}
}
for(let i=8;i<69;i+=4){
  const t=i/78,f=frame(t),size=.26+.23*Math.sin(Math.PI*t),m=new THREE.Mesh(new THREE.ConeGeometry(size,size*2.3,5),mats.mane);
  m.position.copy(f.p).addScaledVector(f.normal,.53);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),f.normal);m.rotateX(Math.sin(i*.7)*.20);m.castShadow=true;dragon.add(m);
}
const hf=frame(.995),head=new THREE.Group();head.position.copy(hf.p);head.quaternion.setFromUnitVectors(new THREE.Vector3(1,0,0),hf.tangent);dragon.add(head);
function ell(rx,ry,rz,mat,x,y,z){const g=new THREE.SphereGeometry(1,28,18);g.scale(rx,ry,rz);const m=new THREE.Mesh(g,mat);m.position.set(x,y,z);m.castShadow=true;head.add(m);return m}
ell(.70,.56,.58,mats.body2,.34,.05,0);ell(.68,.34,.42,mats.body,.98,-.03,0);ell(.30,.22,.35,mats.body2,1.54,-.02,0);
for(const z of [-.31,.31]){const b=ell(.32,.11,.11,mats.mane,.55,.34,z);b.rotation.z=z>0?-.22:.22}
for(const z of [-.40,.40]){ell(.10,.085,.055,mats.eye,.72,.22,z);ell(.045,.06,.022,mats.black,.785,.22,z*1.02)}
for(const z of [-.19,.19])ell(.055,.045,.035,mats.black,1.78,.04,z);
ell(.62,.14,.38,mats.belly,1.10,-.28,0);

function tube(points,r,mat,seg=42){const m=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(points),seg,r,7,false),mat);m.castShadow=true;head.add(m);return m}
for(const z of [-1,1]){
 tube([new THREE.Vector3(.12,.47,z*.34),new THREE.Vector3(-.18,.78,z*.48),new THREE.Vector3(-.62,1.06,z*.54),new THREE.Vector3(-.92,1.36,z*.43)],.075,mats.horn);
 tube([new THREE.Vector3(1.23,-.02,z*.34),new THREE.Vector3(1.65,-.07,z*.67),new THREE.Vector3(1.9,-.25,z*1.03),new THREE.Vector3(1.52,-.48,z*1.38),new THREE.Vector3(.98,-.35,z*1.5)],.025,mats.horn,64);
 tube([new THREE.Vector3(.85,-.35,z*.24),new THREE.Vector3(.65,-.77,z*.34),new THREE.Vector3(.3,-1.02,z*.22)],.035,mats.mane,36);
 const ear=new THREE.Mesh(new THREE.ConeGeometry(.18,.55,5),mats.body2);ear.position.set(.05,.40,z*.49);ear.rotation.z=.82;ear.rotation.x=z*.20;head.add(ear);
}
for(let i=0;i<7;i++){const m=new THREE.Mesh(new THREE.ConeGeometry(.20+.035*i,.80+.05*i,5),mats.mane);m.position.set(-.20-i*.16,.38+i*.02,(i-3)*.12);m.rotation.z=.68;m.rotation.x=(i-3)*.08;head.add(m)}
for(let i=0;i<4;i++)for(const z of [-.22,.22]){const t=new THREE.Mesh(new THREE.ConeGeometry(.045,.18,6),mats.horn);t.position.set(1.12+i*.14,-.35,z);t.rotation.z=Math.PI;head.add(t)}

function cyl(a,b,r,mat){const mid=a.clone().add(b).multiplyScalar(.5),len=a.distanceTo(b),m=new THREE.Mesh(new THREE.CylinderGeometry(r,r*.82,len,9),mat);m.position.copy(mid);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),b.clone().sub(a).normalize());m.castShadow=true;dragon.add(m)}
function claw(p,d){const m=new THREE.Mesh(new THREE.ConeGeometry(.055,.34,7),mats.claw);m.position.copy(p).addScaledVector(d,.17);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d);dragon.add(m)}
function leg(t,s,front=false){const f=frame(t),hip=f.p.clone().addScaledVector(f.side,s*.34),knee=hip.clone().addScaledVector(f.side,s*(front?.54:.46)).add(new THREE.Vector3(0,-.48,0)),ankle=knee.clone().addScaledVector(f.tangent,front?.35:-.2).add(new THREE.Vector3(0,-.50,0));cyl(hip,knee,.12,mats.body2);cyl(knee,ankle,.09,mats.body);for(let k=-1;k<=1;k++){const d=f.tangent.clone().multiplyScalar(.65).addScaledVector(f.side,s*k*.34).add(new THREE.Vector3(0,-.18,0)).normalize();claw(ankle,d)}}
leg(.27,1);leg(.29,-1);leg(.70,1,true);leg(.72,-1,true);

const cloudMat=new THREE.MeshStandardMaterial({color:0xa6c3bd,roughness:.65,transparent:true,opacity:.17});
for(let i=0;i<18;i++){const a=i/18*Math.PI*2,r=3.4+Math.sin(i*1.7)*.7,p=new THREE.Mesh(new THREE.SphereGeometry(.7+(i%4)*.06,16,10),cloudMat);p.position.set(Math.cos(a)*r,-2.45+Math.sin(i*.9)*.12,Math.sin(a)*r*.55);p.scale.y=.42;scene.add(p)}
const platform=new THREE.Mesh(new THREE.CylinderGeometry(4.8,5,.18,96),new THREE.MeshStandardMaterial({color:0x182322,roughness:.78,metalness:.15}));platform.position.y=-2.82;platform.receiveShadow=true;scene.add(platform);
const ring=new THREE.Mesh(new THREE.TorusGeometry(4.15,.018,8,160),new THREE.MeshBasicMaterial({color:0x88d8c7,transparent:true,opacity:.43}));ring.rotation.x=Math.PI/2;ring.position.y=-2.70;scene.add(ring);

const n=420,arr=new Float32Array(n*3);for(let i=0;i<n;i++){arr[i*3]=(Math.random()-.5)*28;arr[i*3+1]=(Math.random()-.5)*15;arr[i*3+2]=(Math.random()-.5)*24}
const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(arr,3));
const dust=new THREE.Points(pg,new THREE.PointsMaterial({color:0xccebe4,size:.025,transparent:true,opacity:.42}));scene.add(dust);

document.getElementById('spin').onclick=e=>{controls.autoRotate=!controls.autoRotate;e.currentTarget.textContent=controls.autoRotate?'Dừng xoay':'Tự xoay'};
document.getElementById('reset').onclick=()=>{camera.position.set(11,6.2,13.5);controls.target.set(0,.65,0);controls.update()};
document.getElementById('material').onclick=()=>{paletteIndex=(paletteIndex+1)%palettes.length;const p=palettes[paletteIndex];mats.body.color.setHex(p.body);mats.body2.color.setHex(p.body2);mats.belly.color.setHex(p.belly);mats.horn.color.setHex(p.horn);mats.mane.color.setHex(p.mane);mats.claw.color.setHex(p.claw);mats.eye.color.setHex(p.eye);mats.eye.emissive.setHex(p.eye)};

const clock=new THREE.Clock();
function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();dragon.position.y=Math.sin(t*.7)*.08;dragon.rotation.z=.025*Math.sin(t*.42);dust.rotation.y=t*.012;ring.material.opacity=.34+.11*Math.sin(t*1.1);controls.update();renderer.render(scene,camera)}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2))});
</script>
</body>
</html>
